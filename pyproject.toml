[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-referee"
version = "1.3.1"
description = "Deterministic, zero-dependency plagiarism and text structure screening engine (Sieve-Core plugin)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kai IWASAKI" }]
dependencies = [
    "sieve-core-engine>=1.0.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/neguseatama/sieve-referee"
Repository = "https://github.com/neguseatama/sieve-referee.git"
"Related Project (Sieve-Core)" = "https://github.com/neguseatama/sieve-core"

[project.scripts]
sieve-referee = "sieve_referee.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sieve_referee*"]
